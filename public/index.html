<!DOCTYPE html>
<html lang="en" class="i18n-loading">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MELCloud Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <!-- ── Top App Bar ─────────────────────────────────────────────── -->
  <header class="app-bar">
    <span class="material-symbols-rounded app-bar-icon">ac_unit</span>
    <h1 class="app-bar-title">MELCloud Dashboard</h1>
    <div class="app-bar-meta" id="lastUpdated"></div>
    <select class="refresh-select" id="refreshInterval" data-i18n-aria-label="dashboard.refreshInterval">
      <option value="30">30 s</option>
      <option value="60" selected>60 s</option>
      <option value="0" data-i18n="dashboard.refreshNever"></option>
    </select>
    <button class="icon-btn" id="refreshBtn" data-i18n-title="dashboard.refresh" data-i18n-aria-label="dashboard.refresh">
      <span class="material-symbols-rounded">refresh</span>
    </button>
    <button class="icon-btn" id="logoutBtn" data-i18n-title="dashboard.logout" data-i18n-aria-label="dashboard.logout" hidden>
      <span class="material-symbols-rounded">logout</span>
    </button>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────── -->
  <main class="main">
    <p class="section-label" data-i18n="dashboard.devices"></p>
    <div class="devices-grid" id="devicesGrid" aria-live="polite"></div>
  </main>

  <script src="i18n/i18n.js" defer></script>
  <script src="dashboard.js" defer></script>
</body>
</html>
